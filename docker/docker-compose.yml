services:
  nodefileview:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8013:8013"
    environment:
      PORT: 8013
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      LIBREOFFICE_PATH: soffice
      BASIC_AUTH_ENABLED: "false"
      AES_ENABLED: "false"
      BLOCK_PRIVATE_IP: "true"
      MAX_UPLOAD_SIZE_MB: "200"
    volumes:
      - ../data:/app/data
    restart: unless-stopped
