name: Docker Build (amd64)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "locales/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".env.example"
      - "docker/Dockerfile"
      - "docker/run.sh"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  APP_VERSION: "1.0.0"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          REPO=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')
          echo "APP_IMAGE=${REGISTRY}/${OWNER}/${REPO}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.APP_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.APP_VERSION }}
            type=sha,prefix={{branch}}-
            type=raw,value=${{ env.APP_VERSION }}-{{sha}}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Docker 镜像已推送（仅打包）"
            echo ""
            echo "- 平台: \`linux/amd64\`"
            echo "- 仓库: \`${APP_IMAGE}\`"
            echo "- Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "到**服务器**上拉取并运行（容器内默认监听 8012，宿主机端口可改）:"
            echo '```bash'
            echo "docker pull --platform linux/amd64 ${APP_IMAGE}:${APP_VERSION}"
            echo "# 正式 8012"
            echo "docker run -d --name nodefileview --restart=always \\"
            echo "  --platform linux/amd64 -p 127.0.0.1:8012:8012 \\"
            echo "  -v /path/to/data:/app/data \\"
            echo "  -e BASIC_AUTH_ENABLED=true -e BASIC_AUTH_USER=admin \\"
            echo "  -e BASIC_AUTH_PASS='你的强密码' \\"
            echo "  -e BASE_URL=https://preview.example.com \\"
            echo "  -e 'TRUST_HOST=*.example.com' \\"
            echo "  ${APP_IMAGE}:${APP_VERSION}"
            echo ""
            echo "# 测试 8013（宿主机 8013 → 容器 8012；或加 -e PORT=8013 且改成 -p 8013:8013）"
            echo "docker run -d --name nodefileview-test --restart=always \\"
            echo "  --platform linux/amd64 -p 127.0.0.1:8013:8012 \\"
            echo "  -v /path/to/data-test:/app/data \\"
            echo "  -e BASIC_AUTH_ENABLED=true -e BASIC_AUTH_USER=admin \\"
            echo "  -e BASIC_AUTH_PASS='你的强密码' \\"
            echo "  -e BASE_URL=https://preview.example.com \\"
            echo "  -e 'TRUST_HOST=*.example.com' \\"
            echo "  ${APP_IMAGE}:${APP_VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
